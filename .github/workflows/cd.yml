name: cd

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: cd
  cancel-in-progress: false

env:
  SERVICE: aeroassist
  REGION: ${{ vars.GCP_REGION }}
  IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/aeroassist/aeroassist

jobs:
  test:
    if: startsWith(github.ref, 'refs/heads/release/') && github.actor == github.repository_owner
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.18"
          enable-cache: true
      - run: uv sync --locked
      - run: make lint test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Build and push the image
        run: |
          gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet
          docker build -t "${IMAGE}:${GITHUB_SHA}" .
          docker push "${IMAGE}:${GITHUB_SHA}"
          echo "DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' "${IMAGE}:${GITHUB_SHA}")" >> "$GITHUB_ENV"
      - name: Deploy the image by digest with all traffic
        run: |
          gcloud run deploy "$SERVICE" --image "$DIGEST" --region "$REGION" --quiet
          gcloud run services update-traffic "$SERVICE" --region "$REGION" --to-latest --quiet
          echo "URL=$(gcloud run services describe "$SERVICE" --region "$REGION" --format='value(status.url)')" >> "$GITHUB_ENV"
          echo "REVISION=$(gcloud run services describe "$SERVICE" --region "$REGION" --format='value(status.latestReadyRevisionName)')" >> "$GITHUB_ENV"
      - name: Smoke test and public evaluation
        run: |
          curl -fsS "$URL/health"
          curl -fsS "$URL/ready"
          python3 scripts/evaluate_public.py --base-url "$URL" | tee evaluation.txt
      - name: Summary
        if: always()
        run: |
          {
            echo "### Deployment"
            echo "- Commit: ${GITHUB_SHA}"
            echo "- Image: ${DIGEST:-not built}"
            echo "- Revision: ${REVISION:-not deployed}"
            echo "- URL: ${URL:-unknown}"
            echo '```'
            cat evaluation.txt 2>/dev/null || echo "no evaluation"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
